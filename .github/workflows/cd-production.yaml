name: CI for Production

on:
  push:
    branches:
      - production

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install --save-dev stylelint stylelint-config-standard htmlhint

      - name: Lint CSS files
        run: npx stylelint "**/*.css"

      - name: Lint HTML files
        run: npx htmlhint "**/*.html"
